{% extends "layout.html" %}

{% block title %}Iniciar Sesión — Gym Tracker{% endblock %}

{% block main_class %}auth-container{% endblock %}

{% block content %}
<section class="auth-card">
    <div class="auth-header">
        <div class="auth-badge" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
        </div>
        <h1 class="auth-title">Iniciar Sesión</h1>
        <p class="auth-subtitle">Accede a tu historial de entrenamientos y récords personales.</p>
    </div>

    <form action="/login" method="POST" class="form-stack">
        <div class="form-field">
            <label for="usuario">Usuario</label>
            <input
                type="text"
                name="usuario"
                id="usuario"
                autocomplete="username"
                spellcheck="false"
                autocorrect="off"
                autocapitalize="none"
                enterkeyhint="next"
                placeholder="Tu nombre de usuario"
                required
            >
        </div>

        <div class="form-field">
            <div class="label-row">
                <label for="password">Contraseña</label>
                <button
                    type="button"
                    class="btn-text-toggle"
                    data-toggle-password="password"
                    aria-pressed="false"
                    aria-label="Mostrar contraseña"
                >Mostrar</button>
            </div>
            <input
                type="password"
                name="password"
                id="password"
                autocomplete="current-password"
                enterkeyhint="done"
                placeholder="Tu contraseña"
                required
            >
        </div>

        <button type="submit" class="btn-primary">Iniciar Sesión</button>
    </form>

    <p class="auth-footer">
        ¿No tienes cuenta? <a href="/register" class="text-link">Regístrate aquí</a>
    </p>
</section>
{% endblock %}
