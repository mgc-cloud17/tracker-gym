<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Gym Tracker</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="contenedor-principal">
        <div class="contenedor-form">
            <h2>📝 Crear Cuenta</h2>
            <form action="/register" method="POST">
                <div class="campo-form">
                    <label for="usuario">Usuario:</label>
                    <input type="text" name="usuario" id="usuario" required autocomplete="off">
                </div>  
                <div class="campo-form">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="campo-form">
                    <label for="confirmation">Confirmar Contraseña:</label>
                    <input type="password" id="confirmation" name="confirmation" required>
                </div>
                <button type="submit" class="btn-guardar">Registrarse</button>
            </form>
            <p style="margin-top: 15px; text-align: center; color: #888;">¿Ya tienes cuenta? <a href="/login" style="color: #00adb5;">Inicia sesión</a></p>
        </div>
    </main>
</body>
</html>
